<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#dc2626" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Inner Cinema Badge -->
  <g filter="url(#glow)">
    <!-- Film / Clapper Slate Shape -->
    <rect x="100" y="120" width="312" height="272" rx="36" fill="url(#redGrad)" />
    
    <!-- Top film reel tape lines -->
    <path d="M100 184 L412 184" stroke="#7f1d1d" stroke-width="6" />
    <path d="M136 120 L168 184" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M208 120 L240 184" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M280 120 L312 184" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M352 120 L384 184" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- Play Button Icon Center -->
    <circle cx="256" cy="288" r="58" fill="#09090b" opacity="0.92" />
    <polygon points="244,260 282,288 244,316" fill="#ffffff" />
  </g>
</svg>
